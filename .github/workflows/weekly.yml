name: Actualizar noticias
on:
  workflow_dispatch:
  schedule:
    # Viernes, 10:00 CDMX (UTC-6; México centro no usa horario de verano)
    - cron: '0 16 * * 5'
concurrency:
  group: weekly-news
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest -v test_project
      - name: Adquirir noticias y mostrar informe
        shell: bash
        run: |
          python main.py update --per-category 10 --days 8 | tee "$RUNNER_TEMP/collection-report.txt"
          cat "$RUNNER_TEMP/collection-report.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar corpus y bitácora
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/news_raw_corpus.tsv
          if [ -f results/collection_log.jsonl ]; then
            git add results/collection_log.jsonl
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Actualización semanal de noticias"
            git push
          fi
